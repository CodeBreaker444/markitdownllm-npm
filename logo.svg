<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="48%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="roundclip">
      <rect width="100" height="100" rx="22"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>

  <!-- Top shine (clipped) -->
  <rect width="100" height="56" fill="url(#shine)" clip-path="url(#roundclip)"/>

  <!-- Subtle inner border -->
  <rect width="100" height="100" rx="22" fill="none"
    stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/>

  <!-- M -->
  <text x="50" y="47"
    font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif"
    font-weight="800" font-size="46" fill="white"
    text-anchor="middle" dominant-baseline="central">M</text>

  <!-- Down arrow: shaft -->
  <line x1="50" y1="70" x2="50" y2="80"
    stroke="rgba(255,255,255,0.9)" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Down arrow: head -->
  <polyline points="43,75.5 50,84 57,75.5"
    fill="none" stroke="rgba(255,255,255,0.9)"
    stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
